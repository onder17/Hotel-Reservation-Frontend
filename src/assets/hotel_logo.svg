<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle
    cx="400"
    cy="400"
    r="330"
    fill="none"
    stroke="#FFD84D"
    stroke-width="10"
    filter="url(#neonGlow)"
  />

  <!-- Top Stars -->
  <g stroke="#FFD84D" stroke-width="6" fill="#FFD84D" filter="url(#neonGlow)">
    <polygon points="400,120 414,155 452,155 420,178 432,215 400,193 368,215 380,178 348,155 386,155"/>
    <polygon points="300,160 312,190 344,190 318,210 328,242 300,224 272,242 282,210 256,190 288,190"/>
    <polygon points="500,160 512,190 544,190 518,210 528,242 500,224 472,242 482,210 456,190 488,190"/>
    <polygon points="220,220 230,245 256,245 235,262 244,288 220,272 196,288 205,262 184,245 210,245"/>
    <polygon points="580,220 590,245 616,245 595,262 604,288 580,272 556,288 565,262 544,245 570,245"/>
  </g>

  <!-- Text -->
  <g stroke="#FFD84D" stroke-width="8" fill="#FFD84D" filter="url(#neonGlow)">
    <text x="400" y="395" text-anchor="middle" font-size="90"
          font-family="Arial, Helvetica, sans-serif" letter-spacing="4">
      NEON STAR
    </text>
    <text x="400" y="475" text-anchor="middle" font-size="70"
          font-family="Arial, Helvetica, sans-serif" letter-spacing="6">
      HOTEL
    </text>
  </g>

  <!-- Bottom Stars -->
  <g stroke="#FFD84D" stroke-width="6" fill="#FFD84D" filter="url(#neonGlow)">
    <polygon points="400,680 414,645 452,645 420,622 432,585 400,607 368,585 380,622 348,645 386,645"/>
    <polygon points="300,640 312,610 344,610 318,590 328,558 300,576 272,558 282,590 256,610 288,610"/>
    <polygon points="500,640 512,610 544,610 518,590 528,558 500,576 472,558 482,590 456,610 488,610"/>
    <polygon points="220,580 230,555 256,555 235,538 244,512 220,528 196,512 205,538 184,555 210,555"/>
    <polygon points="580,580 590,555 616,555 595,538 604,512 580,528 556,512 565,538 544,555 570,555"/>
  </g>
</svg>
